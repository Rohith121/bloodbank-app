name: BloodBank CI/CD

on:
  push:
    branches:
      - master

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  APP_IMAGE: blood-bankapp
  DB_IMAGE: blood-bankdb
  NAMESPACE: bloodbank

jobs:

####################################
# Build
####################################

  build:

    runs-on: self-hosted

    outputs:
      IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate Image Tag
      id: tag
      run: |
        TAG=$(date +'%Y%m%d').${{ github.run_number }}
        echo "image_tag=$TAG" >> $GITHUB_OUTPUT

    - name: Docker Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" \
        --password-stdin

####################################
# Build App
####################################

    - name: Build App Image
      run: |
        docker build \
        -t $DOCKER_USERNAME/$APP_IMAGE:${{ steps.tag.outputs.image_tag }} \
        -t $DOCKER_USERNAME/$APP_IMAGE:v1 .

####################################
# Push App
####################################

    - name: Push App Image
      run: |
        docker push $DOCKER_USERNAME/$APP_IMAGE:${{ steps.tag.outputs.image_tag }}
        docker push $DOCKER_USERNAME/$APP_IMAGE:v1

####################################
# Build DB
####################################

    - name: Build DB Image
      run: |
        docker build \
        -t $DOCKER_USERNAME/$DB_IMAGE:${{ steps.tag.outputs.image_tag }} \
        -t $DOCKER_USERNAME/$DB_IMAGE:v1 \
        ./database

####################################
# Push DB
####################################

    - name: Push DB Image
      run: |
        docker push $DOCKER_USERNAME/$DB_IMAGE:${{ steps.tag.outputs.image_tag }}
        docker push $DOCKER_USERNAME/$DB_IMAGE:v1

############################################################

  deploy:

    needs: build

    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

    steps:

####################################
# Checkout
####################################

    - uses: actions/checkout@v4

####################################
# Configure SSH
####################################

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh

        echo "${{ secrets.MASTER_SSH_KEY }}" > ~/.ssh/id_rsa

        chmod 600 ~/.ssh/id_rsa

        ssh-keyscan -H ${{ secrets.MASTER_HOST }} >> ~/.ssh/known_hosts

####################################
# Deploy App
####################################

    - name: Deploy Application
      run: |
        ssh -o StrictHostKeyChecking=no \
        ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} << EOF

        kubectl set image deployment/bloodbank-app \
        bloodbank-app=$DOCKER_USERNAME/$APP_IMAGE:$IMAGE_TAG \
        -n $NAMESPACE

        kubectl rollout status deployment/bloodbank-app \
        -n $NAMESPACE

        EOF

####################################
# Deploy DB
####################################

    - name: Deploy Database
      run: |
        ssh -o StrictHostKeyChecking=no \
        ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} << EOF

        kubectl set image statefulset/bloodbank-db \
        mysql=$DOCKER_USERNAME/$DB_IMAGE:$IMAGE_TAG \
        -n $NAMESPACE

        kubectl rollout status statefulset/bloodbank-db \
        -n $NAMESPACE

        EOF

####################################
# Verify
####################################

    - name: Verify Deployment
      run: |
        ssh -o StrictHostKeyChecking=no \
        ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} << EOF

        echo "Pods"
        kubectl get pods -n $NAMESPACE

        echo ""

        echo "Services"
        kubectl get svc -n $NAMESPACE

        echo ""

        echo "Ingress"
        kubectl get ingress -n $NAMESPACE

        echo ""

        kubectl rollout status deployment/bloodbank-app -n $NAMESPACE

        kubectl rollout status statefulset/bloodbank-db -n $NAMESPACE

        EOF

####################################
# Rollback
####################################

    - name: Rollback
      if: failure()
      run: |
        ssh -o StrictHostKeyChecking=no \
        ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} << EOF

        kubectl rollout undo deployment/bloodbank-app \
        -n $NAMESPACE

        EOF
