name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  APP_IMAGE: blood-bankapp
  DB_IMAGE: blood-bankdb
  NAMESPACE: bloodbank

jobs:

#############################################################################
# CI
#############################################################################

  build:

    runs-on: self-hosted

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##############################################################
      # Generate Image Tag
      ##############################################################

      - name: Generate Image Tag
        id: tag
        run: |
          IMAGE_TAG=$(date +'%Y%m%d')-$(git rev-parse --short HEAD)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      ##############################################################
      # Docker Login
      ##############################################################

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      ##############################################################
      # Build Application Image
      ##############################################################

      - name: Build App Image
        run: |
          docker build \
          -t $DOCKER_USERNAME/$APP_IMAGE:${{ steps.tag.outputs.image_tag }} \
          .

      ##############################################################
      # Build Database Image
      ##############################################################

      - name: Build Database Image
        run: |
          docker build \
          -t $DOCKER_USERNAME/$DB_IMAGE:${{ steps.tag.outputs.image_tag }} \
          ./database

      ##############################################################
      # Verify Images
      ##############################################################

      - name: Verify Images
        run: docker images

      ##############################################################
      # Push Images
      ##############################################################

      - name: Push Application Image
        run: |
          docker push \
          $DOCKER_USERNAME/$APP_IMAGE:${{ steps.tag.outputs.image_tag }}

      - name: Push Database Image
        run: |
          docker push \
          $DOCKER_USERNAME/$DB_IMAGE:${{ steps.tag.outputs.image_tag }}

#############################################################################
# CD
#############################################################################

  deploy:

    needs: build

    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.MASTER_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.MASTER_HOST }} >> ~/.ssh/known_hosts

      ##############################################################
      # Verify Cluster
      ##############################################################

      - name: Verify Cluster
        run: |
          ssh ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} "

          kubectl get nodes

          kubectl get pods -n $NAMESPACE

          "

      ##############################################################
      # Update Application
      ##############################################################

      - name: Deploy Application
        run: |
          ssh ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} "

          echo 'Updating Application'

          kubectl set image deployment/bloodbank-app \
          bloodbank-app=$DOCKER_USERNAME/$APP_IMAGE:$IMAGE_TAG \
          -n $NAMESPACE

          kubectl rollout status deployment/bloodbank-app \
          -n $NAMESPACE

          "

      ##############################################################
      # Update Database
      ##############################################################

      - name: Deploy Database
        run: |
          ssh ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} "

          echo 'Updating Database'

          kubectl set image statefulset/bloodbank-db \
          bloodbank-db=$DOCKER_USERNAME/$DB_IMAGE:$IMAGE_TAG \
          -n $NAMESPACE

          kubectl rollout status statefulset/bloodbank-db \
          -n $NAMESPACE

          "

      ##############################################################
      # Verify Deployment
      ##############################################################

      - name: Verify Deployment
        run: |
          ssh ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} "

          kubectl get pods -n $NAMESPACE

          kubectl get svc -n $NAMESPACE

          kubectl get ingress -n $NAMESPACE

          "

      ##############################################################
      # Rollback
      ##############################################################

      - name: Rollback Application
        if: failure()
        run: |
          ssh ${{ secrets.MASTER_USERNAME }}@${{ secrets.MASTER_HOST }} "

          kubectl rollout undo deployment/bloodbank-app \
          -n $NAMESPACE

          "
