apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: bloodbank-app-hpa
  namespace: bloodbank

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bloodbank-app

  minReplicas: 2
  maxReplicas: 5

  metrics:

  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 70